name: Temp Env Sync
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Encrypt env
        env:
          EPIC_EMAIL: ${{ secrets.EPIC_EMAIL }}
          EPIC_PASSWORD: ${{ secrets.EPIC_PASSWORD }}
          EPIC_ACCOUNTS: ${{ secrets.EPIC_ACCOUNTS }}
          EPIC_TOTP_SECRET: ${{ secrets.EPIC_TOTP_SECRET }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || secrets.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_MODEL: ${{ vars.GLM_MODEL || secrets.GLM_MODEL }}
          PUB_B64: ""
        run: |
          echo "$PUB_B64" | base64 -d > /tmp/pub.pem
          python3 -c 'import os,json,subprocess,base64; keys=["EPIC_EMAIL","EPIC_PASSWORD","EPIC_ACCOUNTS","EPIC_TOTP_SECRET","LLM_PROVIDER","GEMINI_API_KEY","GEMINI_BASE_URL","GEMINI_MODEL","GLM_API_KEY","GLM_BASE_URL","GLM_MODEL"]; data=json.dumps({k:os.environ.get(k,"") for k in keys}).encode(); p=subprocess.run(["openssl","pkeyutl","-encrypt","-pubin","-inkey","/tmp/pub.pem","-pkeyopt","rsa_padding_mode:oaep"],input=data,capture_output=True,check=True); print("ENC_START:"+base64.b64encode(p.stdout).decode()+":ENC_END")'
